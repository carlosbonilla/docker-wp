name: docker-wp

services:
  wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:7.1.4-php8.3-apache}
    user: "33:33"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    ports:
      - "${WORDPRESS_BIND_ADDRESS:-127.0.0.1}:${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Generate WORDPRESS_DB_PASSWORD in .env}
    volumes:
      - wordpress:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    tmpfs:
      - /tmp
      - /var/run/apache2:uid=33,gid=33,mode=0755
      - /var/lock/apache2:uid=33,gid=33,mode=0755
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4.13}
    user: mysql
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Generate WORDPRESS_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Generate MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    tmpfs:
      - /tmp
      - /run/mysqld:mode=1777
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  wordpress:
  database:
